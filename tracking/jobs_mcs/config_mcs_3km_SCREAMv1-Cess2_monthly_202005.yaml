---
# MCS tracking configuration file for the E3SM SCREAMv1 CESS2 simulation: 3D equivalent reflectivity
# remapped to the HRRR 3-km grid, 5-minute output (feature_type: radar_feature).
#
# Derived from airscape/conus_tracking/config/config_mcs_3km_MRMS_monthly.yaml: every tracking, Steiner, MCS and
# lifecycle parameter is the same as for MRMS so that the two data sets are processed identically; only the input
# data description (file names, variable and coordinate names, 128 hybrid levels with a 3-D height z_mid) is
# SCREAM specific. Input files: scream.diag_equiv_reflectivity.5min.INSTANT.nmins_x5.YYYY-MM-DD-hhmmss.nc
#
# Unlike config_mcs_tbpf_*.yml (Tb + precipitation) or the tb_pf_radar3d
# configs (Tb + SL3D), this pipeline identifies and tracks MCS directly from
# 3D (or 2D) Cartesian radar reflectivity alone: no Tb, no PF-linking, no
# SL3D. See pyflextrkr/idfeature_radar3d.py.
#
# Run (one node, own Dask LocalCluster): python runscripts/run_mcs_radar3d.py <config>
# Monthly files: scream/tracking/generate_tracking_scripts.py -s 2020-04 -e 2020-09 \
#     -c config_mcs_3km_SCREAMv1-Cess2_monthly.yaml -l slurm_SCREAM-Cess2_conus_mcstracking.sh \
#     -r run_mcs_radar3d.py -o jobs_mcs

# Processing steps:
run_idfeature : True          # parallel (batched by time frame, see combine_files below)
run_tracksingle : True        # parallel
run_gettracks : True          # serial
run_trackstats : True         # parallel
run_identifymcs : True       # serial
run_regionprops : True       # parallel (shape/extremes on the merged mask + lifecycle staging; needs conv_feature_number from run_idfeature unless conv_dilate_overwrite_radius_km is set)
run_mapfeature : True        # parallel
run_speed : True            # optional (movement speed, written to mcsfinal_filebase)

# Parallel processing set up
# run_parallel: 0 (serial), 1 (local cluster), 2 (Dask distributed scheduler)
run_parallel: 1
nprocesses: 64  # Number of processors to use if run_parallel=1 (SCREAM: about 5 GB per worker in idfeature, 128 levels; 64 workers = 236 GB of 512 GB)
dask_tmp_dir: /tmp  # Dask temporary directory if run_parallel=1
timeout: 360  # [seconds] Dask timeout limit

# Batched multi-file time-frame processing (idfeature_driver.py).
# combine_files: False (monthly runs): one dask task per input file; each task is only a file name.
# combine_files: True: lazily combine all files in the time range into one Dataset (xr.open_mfdataset) and
# dispatch one task per TIME FRAME in batches. Every task then carries a slice of the whole combined dataset, so
# the task graph grows with frames x files: fine for a few days, but for a month (8,640-8,928 files) the main process
# needed hours to build the graphs, workers hit the memory limit and a batch could hang on one frame.
# Tested on May 2025 (8,928 files, 64 workers, one node): False 55 min for idfeature, True did not finish in 6 h.
combine_files: False
# Only used with combine_files: True. Explicit batch size override. Leave null to use
# (total worker threads) * dask_batch_multiplier instead.
dask_batch_size: null
dask_batch_multiplier: 16

# Start/end date and time (replaced by generate_tracking_scripts.py for each month)
startdate: '20200501.0000'
enddate: '20200601.0000'

# Specify tracking input data date/time string format
# E.g., scream.diag_equiv_reflectivity.5min.INSTANT.nmins_x5.2020-06-13-220000.nc --> yyyy-mo-dd-hhmmss
time_format: yyyy-mo-dd-hhmmss
databasename: scream.diag_equiv_reflectivity.5min.INSTANT.nmins_x5.  # all characters before the time (including ".")
input_format: netcdf  # zarr or netcdf

# Input files directory
clouddata_path: /pscratch/sd/w/wcmca1/SCREAMv1-cess2/remap_conus_5min/
# Working directory for the tracking data
root_path: /pscratch/sd/w/wcmca1/SCREAMv1-cess2/mcs_conus/
# Working sub-directory names
tracking_path_name: tracking/2020-05  # one folder per month (the placeholder is replaced by generate_tracking_scripts.py)
stats_path_name: stats
pixel_path_name: mcstracking

# Terrain file (HRRR grid, the same as for MRMS): the surface elevation (sfc_elev) that sfc_dz_min/max
# are measured relative to. z_mid of SCREAM is height above sea level, like heightAboveSea of MRMS.
terrain_file: /pscratch/sd/w/wcmca1/SCREAMv1-cess2/maps/hrrr_sfc_latlon_orog_lsm.nc
elev_varname: orog

# Specify types of feature being tracked
# This adds additional feature-specific statistics to be computed
feature_type: radar_feature

# -----------------------------------------------------------------------
# Input dataset structure
# -----------------------------------------------------------------------
pixel_radius: 3.0  # [km] Spatial resolution of the input data
area_method: fixed  # 'fixed' (default) or 'latlon' for latitude-dependent grid cell area
datatimeresolution: 0.083333  # [hour] ~5 minutes
reflectivity_varname: diag_equiv_reflectivity  # [dBZ], (time, lev, y, x), lev = 128 hybrid levels ordered top to bottom (reversed by the code)
dx: 3000  # [m]
dy: 3000  # [m]
x_dimname: x
y_dimname: y
z_dimname: lev
time_dimname: time
x_coordname: longitude
y_coordname: latitude
z_coordname: z_mid  # [m] 3-D height of each level (time, lev, y, x), above sea level
lon_coordname: longitude
lat_coordname: latitude
time_coordname: time
radar_sensitivity: 0.0  # [dBZ] minimum reflectivity threshold; below this (or NaN) is floored

# Vertical coordinate settings
# z_mid has units m (no override needed).
z_coord_type: height
default_sfc_height: 0.0  # [m], used only if terrain_file is not provided
sfc_dz_min: 1000.0    # [m] offset from surface to exclude near-surface contamination
sfc_dz_max: 2500.0    # [m] range above sfc_dz_min used for low-level reflectivity
z_coord_scale_factor: null
sfc_elev_scale_factor: null
z_coord_units_override: null
sfc_elev_units_override: null
# geolimits: [lat_min, lon_min, lat_max, lon_max]  # optional domain subset

# -----------------------------------------------------------------------
# [Phase 1] Feature labeling and growth options
# (used by idfeature_radar3d.py via label_and_grow_features; follows the
# same detect-and-grow approach as idclouds_tbpf, but core_operator='gt'
# since higher reflectivity = more intense, unlike cold Tb)
# -----------------------------------------------------------------------
feature_dbz_threshs: [30, 10]  # [dBZ] [core_thresh, secondary/growth_thresh]
smooth_size: 10       # Box2DKernel smoothing window before core detection
min_core_npix: 4      # Minimum number of pixels for a smoothed core
area_thresh: 81      # [km^2] Minimum area to define a feature (4 pixels @ 3km)
core_operator: gt     # 'gt': field > threshold defines cores (reflectivity)
growth_method: bfs    # 'bfs' or 'edt' (Voronoi, faster)
feature_expand_tertiary: 0  # No tertiary expansion (thresholds collapse to 2 levels)
feature_field_floor: null   # Defaults to radar_sensitivity if not set
miss_thresh: null     # Optional: skip frames with column-max NaN fraction above this

# -----------------------------------------------------------------------
# [Phase 1] Steiner convective/stratiform classification
# Follows the cell-tracking identification config parameters
# (config_celltracking_3km_MRMS.yaml).
# -----------------------------------------------------------------------
# The background reflectivity fall off point in the cosine fucntion,
# if background reflectivity > absConvThres [dBZ], the grid point is a convective core
absConvThres: 60
# Minimum difference to background reflectivity [dB] in the cosine function
minZdiff: 10
# Any grid point reflectivity > truncZconvThres [dBZ] is automatically a convective core
truncZconvThres: 55
# These two reflectivity values sets up the step function background Ze values
# They control the dilation of grids surrounding the convective cores to be included as "convective region"
mindBZuse: 25
dBZforMaxConvRadius: 60
# Convective radius step-function start value [km]
conv_rad_start: 3.0
# Convective radius step-function end value (maximum convective radius dilation) [km]
maxConvRadius: 5.0
# Convective radius step-function increment [km]
conv_rad_increment: 0.5
# Background reflectivity step-function increment [dB]
bkg_refl_increment: 5
# Background radius to calculate background reflectivity intensity [km]
bkgrndRadius: 13.5
# Minimum area threshold to be a convective core [km^2]
min_corearea: 9.0
# Minimum area threshold to be a convective cell [km^2]
min_cellarea: 81.0
remove_smallcores: True
remove_smallcells: True
weakEchoThres: 15
# Convolution method to calculate background reflectivity: fft (default), ndimage, signal
convolve_method: fft
# dilate_method: Method used for dilating convective cores. Options include 'orig' (original) and 'edt'.
dilate_method: orig
return_diag: False
# Number of vertical level gaps allowed in calculating echo-top height (levels, not metres: 2 bridges one missing level).
# Tested on SCREAM (2020-06-13 22Z, test_echotop_gap.py): gap 1 to 16 and "no limit" change the cell maximum
# 10-dBZ echo top by less than 0.2 km (see README_echotop_gap.md). 8 was chosen here (the MRMS MCS config uses 2).
echotop_gap: 8
echotop_method: fast
# cell_number: labeled, size-sorted convective cell ID derived from the
# Steiner diagnostic mask (see plan Design decision 1).
cell_number_source: score_orig  # 'score_orig' (pre small-core filter) or 'score_dilate'
cell_min_npix: 0
# conv_feature_number: the Steiner convective pixels dilated by a disc of this radius, then labeled (sorted by size).
# Convective cells that do not touch but are closer than 2 x this radius form one convective feature (used for
# conv_majoraxis and the lifecycle staging). 0 = only pixels that touch (8-connected).
conv_dilate_radius_km: 9  # [km]
# conv_dilate_overwrite_radius_km: if set, run_regionprops and mapfeature recompute conv_feature_number at this radius
# (the same dilation of the Steiner convective pixels as idfeature) instead of using the one in the cloudid files.
# This changes conv_majoraxis and the lifecycle staging without re-running idfeature and the tracking (the tracks do
# not depend on the radius). The cloudid files are not modified. null (default) = use the cloudid files' groups.
conv_dilate_overwrite_radius_km: null  # [km] (e.g. 9 = 3 pixels); null = off
# regionprops_track_classes: null = run_regionprops measures every track. A list of track_class values, e.g. [1, 2] (MCS and
# multi-cell), measures only those tracks; the others keep their first-pass values (own feature, not the merged mask) and get
# no lifecycle staging. Measured on May 2025 it saves about 6 of 37 minutes (smoothing loop), so null.
regionprops_track_classes: null

# -----------------------------------------------------------------------
# Tracking parameters
# -----------------------------------------------------------------------
othresh: 0.5   # overlap fraction threshold
timegap: 0.25  # [hour] If missing data duration longer than this, tracking restarts
nmaxlinks: 50  # Maximum number of clouds that any single cloud can be linked to
maxnclouds: 3000  # Maximum number of clouds in one snapshot
auto_update_maxnclouds: True
duration_range: [2, 10]  # [minlength, maxlength] in time steps
duration_range_auto_update: True
duration_range_round_base: 10
remove_shorttracks: 1
trackstats_dense_netcdf: 1
match_pixel_dt_thresh: 60.0  # [seconds]

# Define tracked feature variable names
feature_varname: feature_number
nfeature_varname: nfeatures
featuresize_varname: npix_feature

# Track statistics output file dimension names
tracks_dimname: tracks
times_dimname: times
fillval: -9999

# File base names
mcstbstats_filebase: mcs_tracks_
mcsradarstats_filebase: mcs_tracks_  # identifymcs_radar output (first pass); regionprops reads it and writes mcsrobust_filebase
mcspfstats_filebase: mcs_tracks_pf_
mcsrobust_filebase: mcs_tracks_robust_
pixeltracking_filebase: mcstrack_

# -----------------------------------------------------------------------
# [Phase 2] trackstats_func.py radar_feature branch
# -----------------------------------------------------------------------
trackstats_dbz_area_threshs: [45, 50]  # [dBZ] area_<T>dbz / conv_area_<T>dbz thresholds
ref_varname: dbz_comp

# -----------------------------------------------------------------------
# [Phase 3] identifymcs_radar.py - radar-based MCS definition and lifecycle
# -----------------------------------------------------------------------
mcs_majoraxis_thresh: 100  # [km] MCS feature major axis length lower limit
mcs_dbz45_area_varname: area_45dbz  # whole-feature reflectivity-threshold area
mcs_dbz45_area_thresh: 0  # [km^2] must be > this (i.e. > 0 pixels)
mcs_duration_thresh: 4  # [hour] Minimum duration of MCS criteria being met
mcs_gap_hour: 0.25  # [hour] Allowable gap bridging MCS criteria time groups
mcs_merge_duration: 4.0  # [hour] Non-MCS tracks with lifetime < this that end by merging into another track are fragments
mcs_split_duration: 4.0  # [hour] Non-MCS tracks with lifetime < this that start by splitting from another track are fragments
mcs_lifecycle_thresh: 8  # [hour] Minimum MCS duration to evaluate lifecycle stages
mcs_lifecycle_line_thresh: 100  # [km] Convective line major axis threshold for organized convection
mcs_lifecycle_gap_hour: 1.0  # [hour] Gap bridging separate convective line episodes
mcs_lifecycle_genesis_lag_hour: 1.0  # [hour] Lag after line organizes before genesis starts
mcs_lifecycle_mature_lag_hour: 2.0  # [hour] Lag after genesis before mature stage starts
mcs_lifecycle_sf_area_min: 0  # [km^2] Minimum stratiform area floor for the mature-stage test
mcs_lifecycle_smooth_hour: 0.5  # [hour] Running-median window of conv_area, conv_majoraxis and strat_area before the lifecycle thresholds (0 = off)
# identifymcs_radar writes the first-pass track stats to the mcsradarstats_filebase file; regionprops (run_regionprops)
# recomputes shape/extremes on the merged mask (own feature + folded merge/split fragments), stages the lifecycle and
# writes the mcsrobust_filebase file. mapfeature and movement_speed read that file, movement_speed writes the
# mcsfinal_filebase file.
finalstats_min_area: 0  # [km^2] Optional safety-valve filter; 0 = keep all tracks (default)
finalstats_min_duration: null  # [hour] Optional safety-valve filter; null = keep all tracks

# -----------------------------------------------------------------------
# [Phase 4] mapfeature_func.py radar_feature branch
# -----------------------------------------------------------------------
dbz_thresh: 10  # [dBZ] threshold for the dbztracknumber pixel map
mapfeature_class_varname: feature_class

# Feature movement speed parameters (optional, run_speed)
lag_for_speed: 1
track_number_for_speed: dbztracknumber
track_field_for_speed: dbz_comp
min_size_thresh_for_speed: 20
max_speed_thresh: 50
max_speed_for_trajectory_smoothing: 40
mcsfinal_filebase: mcs_tracks_final_
